# -- Number of replicas
replicaCount: 1

# -- Container image settings
image:
  # -- Image repository
  repository: nginx
  # -- Image pull policy
  pullPolicy: Always
  # -- Image tag (defaults to Chart.AppVersion if empty)
  tag: "latest"

# -- Container port the app listens on
containerPort: 80

# -- Secrets for pulling images from private registries
imagePullSecrets:
  # - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

# -- Service configuration
services:
  - name: http
    # -- Kubernetes Service type
    type: ClusterIP
    # -- Service port (external)
    port: 80
    # -- Target port on the container (must match containerPort)
    targetPort: 7011

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: true
  # -- Ingress class name
  className: traefik
  # -- Ingress annotations
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  # -- Ingress host rules
  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: Prefix
  # -- Redirect HTTP to HTTPS (adds traefik websecure entrypoint)
  httpsRedirect: true
  # -- Service name to route traffic to (must match a name in `services`)
  serviceName: http
  # -- Service port to route traffic to
  servicePort: 80
  # -- TLS configuration
  tls:
    - secretName: example-com-tls
      hosts:
        - example.com

# -- Prometheus ServiceMonitor configuration
metrics:
  # -- Enable ServiceMonitor CRD
  enabled: false
  # -- Interval to scrape metrics
  interval: 30s
  # -- Scrape timeout
  scrapeTimeout: 10s
  # -- Metric endpoint configuration
  metric:
    # -- Port name on the service to scrape
    port: http
    # -- HTTP path to scrape metrics from
    path: /metrics
resources: {}

# -- Environment variables for the main container
env: []
# - name: DEBUG
#   value: "false"

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# -- Init containers run before the main app container.
# Each init container image can have its own entrypoint/CMD; you can override
# them via `command` and `args`. Pull secrets are shared at the pod level.
initContainers: []
# - name: init-setup
#   image:
#     repository: busybox
#     pullPolicy: IfNotPresent
#   command:
#     - /bin/sh
#     - -c
#     - |
#       echo "Running init setup..."
#   resources: {}
#   securityContext: {}

volumes: []
volumeMounts: []

# -- Host aliases for the pod (adds entries to /etc/hosts)
hostAliases: []
# - ip: "127.0.0.1"
#   hostnames:
#     - "foo.local"
#     - "bar.local"

nodeSelector: {}
tolerations: []
affinity: {}
