stages:
  - build

variables:
  REGISTRY: registry-repo.zar.plus
  OCI_REPO: registry-repo.zar.plus/modopod/helm-template
  CHART_DIR: charts/gen

lint:
  stage: build
  image:
    name: alpine/helm:3.19.5
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - helm lint "$CHART_DIR"
    - helm template test "$CHART_DIR" > /dev/null

publish-oci:
  stage: build
  image:
    name: alpine/helm:3.19.5
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^gen-/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  before_script:
    - echo "$REGISTRY_PUSH_PASS" | helm registry login "$REGISTRY" -u "$REGISTRY_PUSH_USER" --password-stdin
  script:
    - CHART_NAME=$(helm show chart "$CHART_DIR" | awk '/^name:/ {print $2}')
    - CHART_VERSION=$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')
    - echo "Publishing ${CHART_NAME}:${CHART_VERSION} to ${OCI_REPO}"
    - |
      if helm show chart "oci://${OCI_REPO}/${CHART_NAME}:${CHART_VERSION}" >/dev/null 2>&1; then
        echo "Already published — skipping"
        exit 0
      fi
    - helm package "$CHART_DIR" -d dist
    - helm push "dist/${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${OCI_REPO}"
